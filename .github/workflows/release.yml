name: Build and release the Otzaria family

# Pushing a tag builds the six static weights from the sources in this repository and
# publishes them as a release named after the tag.
# A manual run only builds, and keeps the fonts as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: pip install fonttools==4.68.0 shapely==2.2.0 numpy==2.5.4 pillow==13.0.0 uharfbuzz==0.57.0
      - name: The package version must match the tag
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version: *//p' package/pubspec.yaml | tr -d '\r')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package/pubspec.yaml says $have"
            exit 1
          fi
      - name: Build
        run: |
          mkdir -p out
          python scripts/otzaria/build_family.py "fonts/variable/Mekorot[wght].ttf" \
            sources/otzaria/NotoRashiHebrew-VariableFont_wght.ttf out
          ls -l out
          test "$(ls out/Mekorot-*.ttf | wc -l)" -eq 6
      - name: Compare with the fonts committed for the Flutter package
        run: |
          # the app takes the fonts from package/lib at the tagged commit, not from the release
          python - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          for path in sorted(glob.glob('out/Mekorot-*.ttf')):
              name = os.path.basename(path)
              a, b = TTFont(path), TTFont('package/lib/' + name)
              # head only carries the build time and the checksum that follows from it
              diff = [t for t in sorted(set(a.keys()) | set(b.keys()))
                      if t not in ('GlyphOrder', 'head')
                      and (t not in a or t not in b or a.getTableData(t) != b.getTableData(t))]
              if diff:
                  print('::warning::%s differs from package/lib in %s (the app uses the committed file)'
                        % (name, ', '.join(diff)))
                  # how far apart: outlines, advances
                  moved, worst, other = 0, 0, []
                  for g in a.getGlyphOrder():
                      if g not in b['glyf'].glyphs:
                          other.append(g)
                          continue
                      ga, gb = a['glyf'][g], b['glyf'][g]
                      if ga.numberOfContours <= 0 or gb.numberOfContours <= 0:
                          continue
                      ca, cb = list(ga.coordinates), list(gb.coordinates)
                      if len(ca) != len(cb):
                          other.append(g)
                      elif ca != cb:
                          moved += 1
                          worst = max(worst, max(max(abs(p[0] - q[0]), abs(p[1] - q[1])) for p, q in zip(ca, cb)))
                  adv = [g for g in a.getGlyphOrder() if g in b['hmtx'].metrics and a['hmtx'][g][0] != b['hmtx'][g][0]]
                  print('  outlines moved: %d glyphs, by at most %d units; different point count: %s; advances: %s'
                        % (moved, worst, other[:12], adv[:12]))
              else:
                  print(name + ': same as package/lib')
          PY
      - name: Zip
        run: |
          cp OFL.txt out/
          cd out && zip Mekorot-family.zip Mekorot-*.ttf OFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Mekorot-family
          path: out/
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/Mekorot-*.ttf out/Mekorot-family.zip out/OFL.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
              out/Mekorot-*.ttf out/Mekorot-family.zip out/OFL.txt
          fi
